<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTM — Modular Tool for Minecraft</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  color: #e0e0ff;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

#join-screen { text-align: center; padding: 20px; }
#join-screen h1 {
  font-size: 42px; color: #e040fb; font-weight: 300;
  letter-spacing: 3px; margin-bottom: 5px;
}
#join-screen .sub { color: #7c4dff; font-size: 14px; margin-bottom: 35px; }
#join-screen input {
  background: #1a1a2e; border: 1px solid #4a0072;
  padding: 14px 20px; border-radius: 8px;
  color: #e0e0ff; font-size: 16px; width: 260px;
  outline: none; text-align: center;
}
#join-screen input:focus { border-color: #9c27b0; }
#join-screen input::placeholder { color: #4a148c; }
#join-screen .btn {
  display: block; margin: 15px auto 0;
  padding: 14px 50px; background: #9c27b0; color: white;
  border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
  cursor: pointer;
}
#join-screen .btn:hover { background: #ab47bc; }
.error-msg { color: #ff5252; font-size: 13px; margin-top: 10px; min-height: 20px; }

#chat-screen { display: none; height: 100vh; width: 100%; max-width: 700px; margin: 0 auto; flex-direction: column; }
#chat-screen.active { display: flex; }

.chat-header {
  display: flex; align-items: center; padding: 14px 18px;
  background: #0a0a1a; border-bottom: 1px solid #1a1a2e; flex-shrink: 0;
}
.chat-header .brand { font-size: 18px; font-weight: 600; color: #e040fb; }
.chat-header .player-name { margin-left: 12px; font-size: 13px; color: #7c4dff; flex-grow: 1; }
.chat-header .status { font-size: 11px; color: #4a148c; }
.chat-header .status.online { color: #4caf50; }

.chat-msgs {
  flex-grow: 1; overflow-y: auto; padding: 15px 18px;
  display: flex; flex-direction: column; gap: 8px;
}
.chat-msgs::-webkit-scrollbar { width: 6px; }
.chat-msgs::-webkit-scrollbar-track { background: #0a0a1a; }
.chat-msgs::-webkit-scrollbar-thumb { background: #1a1a2e; border-radius: 3px; }

.msg { max-width: 85%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
.msg.user { background: #6a1b9a; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.bot { background: #1a1a2e; color: #e0e0ff; align-self: flex-start; border-bottom-left-radius: 4px; }
.msg .sender { font-size: 11px; font-weight: 600; margin-bottom: 3px; opacity: 0.7; }
.msg.user .sender { color: #ce93d8; }
.msg.bot .sender { color: #9c27b0; }
.msg .time { font-size: 10px; opacity: 0.4; margin-top: 4px; text-align: right; }
.msg.welcome {
  background: transparent; border: 1px solid #1a1a2e;
  color: #7c4dff; align-self: center; text-align: center; font-size: 13px; max-width: 100%;
}

.chat-input {
  display: flex; padding: 12px 18px; background: #0a0a1a;
  border-top: 1px solid #1a1a2e; gap: 8px; flex-shrink: 0;
}
.chat-input input {
  flex-grow: 1; background: #1a1a2e; border: 1px solid #4a0072;
  padding: 12px 16px; border-radius: 8px; color: #e0e0ff;
  font-size: 14px; outline: none;
}
.chat-input input:focus { border-color: #9c27b0; }
.chat-input input::placeholder { color: #4a148c; }
.chat-input input:disabled { opacity: 0.5; }
.chat-input .btn {
  padding: 12px 20px; background: #9c27b0; color: white;
  border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
  cursor: pointer; flex-shrink: 0;
}
.chat-input .btn:hover { background: #ab47bc; }
.chat-input .btn:disabled { opacity: 0.5; cursor: default; }

@media (max-width: 500px) {
  .msg { max-width: 92%; font-size: 13px; }
  #join-screen input { width: 100%; }
}
</style>
</head>
<body>

<div id="join-screen">
  <h1>⚡ MTM</h1>
  <p class="sub">Modular Tool for Minecraft — built by revalize</p>
  <input id="name-input" type="text" placeholder="Enter your IGN..." maxlength="16" autofocus>
  <button class="btn" onclick="join()">Join Chat</button>
  <div id="join-error" class="error-msg"></div>
</div>

<div id="chat-screen">
  <div class="chat-header">
    <span class="brand">⚡ MTM</span>
    <span class="player-name" id="display-name"></span>
    <span class="status" id="status">ready</span>
  </div>
  <div class="chat-msgs" id="msg-area">
    <div class="msg welcome">Type your IGN above to start chatting with MTM.</div>
  </div>
  <div class="chat-input">
    <input id="msg-input" type="text" placeholder="Type a message..." disabled>
    <button class="btn" id="send-btn" onclick="send()" disabled>➤</button>
  </div>
</div>

<script>
const API_URL = '/api/chat';
const MODEL = 'zai-glm-4.7';

const SYSTEM = `You are MTM — Modular Tool for Minecraft, built by revalize. You are a helpful AI assistant for a Minecraft server running on Minehut with Paper/Spigot. The server uses Origins-Reborn with addon packs: Origins-Fantasy, Origins-Magic, Origins-Mobs, Origins-Monsters, and the Corrupted-Aspects mod. It also uses PowerTrims v2.9. Be friendly, respectful, and concise. Address the player by their name: "{name}". You know Minecraft inside out. Only talk about Minecraft or the plugins if the player asks first. Never give harmful advice.

Use these commands when the player asks:
- /build — suggest a random cool build idea
- /recipe <item> — explain how to craft something
- /seed — suggest a random interesting seed
- /roll — pick a random origin for the player
- /tip — share a random pro Minecraft tip
- /challenge — give a random survival challenge
- /invasion — describe a custom raid/pillager event
- /lore — generate lore for a location or item
- /potion — suggest a useful potion recipe
- /structure — describe an interesting structure to find or build

=== ORIGINS-REBORN (Base) ===
Arachnid: Climb walls and ceilings. Shoot webs. Extra jump. Poison damage like cave spiders. Less health.
Avian: Slow falling. Elytra flight. Faster running speed on ground. Weaker melee damage.
Blazeborn: Immune to fire/lava. Fire aspect on attacks. Swim in lava. Take damage in water.
Elytrian: Has elytra. Launch into air. Immune to fall damage. Less health. Bigger frame.
Enderian: Enderman appearance. Water damages you. Throw ender pearls without damage. Teleport ability. Taller.
Feline: Jump boost. Permanent night vision. Fall damage negation. Faster. Less health.
Merling: Breathe underwater. Faster swim. Mine faster underwater. Can't breathe on land. Burn on land.
Phantom: Phantom form. Can phase through blocks when hungry. Burn in daylight. Need to eat often.
Shulk: Natural armor (shell). Extra inventory rows. Slower movement. Weaker attack.
Human: No special powers. Extra inventory slots.

=== ORIGINS-FANTASY ===
Bard: Deal more damage on low health. Gain regen near note blocks. Duplicate allays without jukebox. Regen by right-clicking amethyst shard. 25% chance creepers drop music discs.
Centaur: Permanently mounted (horse form). Higher jump than horses. Faster than horses. Stronger on full moons. Perfect bow aim.
Dragonborn: Collect dragon breath with bottles. Stronger and more HP in the End. Healed by end crystals. Shoot fireball with sword. Less arrow damage.
Dwarf: Infinite haste. Permanent night vision. More ore drops from mining. Immune to poison/harming. Only 1 block tall.
Elf: Perfect bow aim. Faster in forests. Keener vision.
Giant: Stone skin. Knockback immune. Immune to fire and status effects. More melee damage but slower attack. Natural armor. Slower movement.
Naiad: Extra HP and damage in water/rain. Weaker/slower on land. Breathe underwater but not on land. Underwater vision. Break blocks underwater at normal speed. Swim faster. Selective sinking.
Vampire: Turn other players into vampires by killing them. Burn in daylight. Take damage in water. Heal on kill. Deal more damage. Undead mobs ignore you.

=== ORIGINS-MAGIC ===
Alchemist: Potions are 1 level stronger and last 2x as long. Right-click copper to turn to gold and vice versa. 0.75x damage. Only 3 hearts in water.
Telekinetic: Interact with blocks/entities/items from further away. Drops go directly to inventory. 0.75x damage. Only 3 hearts in water.
Healer: Survive death once every 10 minutes. Right-click gives Regen II for 10 seconds. Infinite Regen II when standing still. 0.75x damage. Only 3 hearts in water.
Hypnotist: Right-click a monster to make it attack your last target. Right-click a player for Nausea 30s. 0.75x damage. Only 3 hearts in water.
Necromancer: Undead target whatever you hit. Swing fist to revive dead players where they died. More HP/damage in Nether, less outside. Undead ignore you. Villagers won't trade. 3 hearts in water.
Spirit: Footsteps undetected by sculk sensors. Invisible when standing still. More HP/damage in Nether. 3 hearts in water.
Warlock: Absorb up to 30 extra HP from kills. Hits inflict random negative effect for 15s. Undead ignore you. Can't use enchantments or potions. Villagers won't trade. 3 hearts in water.
Shadowmancer: Fully invisible and cannot be interacted with in dark areas. More damage in dark, less in light. Set on fire in light. Double fire damage. Fire Resistance doesn't work. 3 hearts in water.

=== ORIGINS-MOBS ===
Bee: Every 5s poison on hit. Regen near flowers. Bees ignore you when taking honey. 2 less hearts.
Drowned: Trident ability (channeling without lightning, riptide without rain) for 20s, 60s CD. Underwater vision. Guardians ignore you. More damage in water. Breathe underwater. Burn in daylight. Extra Smite damage. Faster hunger loss. Slower on land.
Evoker: Left-click to summon evoker fangs. 10% chance totem doesn't break. Pillagers/illagers like you. Villagers dislike you.
Fox: Faster when 3+ players nearby. Berries give more saturation. Sweet berry bushes don't hurt. Pick up items from further. Faster. 2 less hearts.
Slime: Bounce on all blocks. Split and summon slime minion using hunger. More knockback but less damage at low HP. No fall damage.
Snow Golem: Water damages you. Weaker in warm biomes. Snowballs deal damage. Leave snow trail. More damage in cold areas.
Strider: Fire immune. Spawn in Nether. Water damages. Walk on lava. Slower on land. Others can ride you. Warped fungus gives speed boost.
Witch: Potions last 2x as long. Left-click empty hand to drink a situational potion. Witch particles. Pillagers/illagers like you. Villagers dislike you.
Wolf: 2 less hearts. Faster/stronger/more HP during full moon. Wolves you tame are stronger. Howl to give allies speed+strength. 4+ nearby wolves boosts your damage and speed.
Guardian: Natural thorns. Guardians ignore you. Natural armor. Weaker on surface. Breathe underwater but not on land. Underwater vision. Break blocks faster underwater. Swim faster. Extra Impaling damage. Get air from potions. Transform into Elder Guardian by killing one.
Elder Guardian: Unchoosable — transform from Guardian. All Guardian abilities. Stronger thorns. Stronger armor. Mining fatigue immune. Left-click to give fatigue to nearby players.

=== ORIGINS-MONSTERS ===
Creeper: Other creepers ignore you. Explode by double-tap sneak (costs health). Nausea/weakness near cats. Can't use shields.
Zombie: Night vision on land. Undead ignore you unless attacked. Extra Smite damage. Burn in daylight. Slower. Faster hunger loss. Villagers flee/won't trade. Zombify villagers by killing them. Transform into Husk in warm biomes or Drowned in water.
Husk: Unchoosable — transform from Zombie in warm biomes. Same as Zombie but even slower in cold biomes. Transform back to Zombie in water.
Drowned (Monsters version): Unchoosable — transform from Zombie in water. Same as Mobs Drowned. Transform back to Zombie in warm biomes.
Skeleton: Night vision. Infinite arrows. Undead ignore you unless attacked. Perfect bow aim. Extra Smite damage. Burn in daylight. 2 less hearts. Half saturation. Transform into Stray in cold biomes.
Stray: Unchoosable — transform from Skeleton in cold/powder snow. Infinite arrows. Powder snow immune. Perfect bow aim. Arrows inflict Slowness. Extra Smite damage. Burn in daylight. 2 less hearts. Slower in warm biomes. Double fire damage.
Warden: Sense nearby creatures (glowing outline). Can only see a few blocks (night vision helps). Double damage. Double HP. Natural defense. Can't use shields.
Wither Skeleton: Hits inflict Wither. Undead ignore you unless attacked. Wither immune. Extra Smite damage. 2 less hearts. Half saturation. Fire immune. Spawn in Nether.
Piglin: Gold armor = diamond and unbreakable. 2-5x bartering resources. Piglins ignore you even if you break gold/open chests. Perfect bow aim. Spawn in Nether. Transform into Zombified Piglin in Overworld.
Zombified Piglin: Unchoosable — transform from Piglin in Overworld for 15s. Gold weapons 2x power and unbreakable. Nearby Zombified Piglins fight for you. Undead ignore you. Extra Smite damage. Slower. Faster hunger loss. Fire immune. Spawn in Nether. Transform back with weakness + golden apple.

=== CORRUPTED-ASPECTS (Aspects mod) ===
A system where you collect mob essences using the Evergrowing Blade, store them in an Essence Cage, and unlock Aspects. Each mob has up to 3 essences (Aquatic, Fire, Void, etc.). Requires 120 total essence units (split across types).
Human: No effects. No focus ability. Requires Humanoid essence.
Merling: Breathe underwater but not on land. Faster in water, slower on land. More trident damage. Focus: Highlight wet mobs/players. Requires Aquatic essence.
Enderian: Water is harmful. More HP and reach, 3 blocks tall. Ender pearls don't self-harm. Focus: Teleport forward. Requires Void + Humanoid essence.
Shulk: Less HP, reach, damage, 1 block tall. Self-repairing shell absorbs small damage. Focus: Store/retrieve chest or barrel. Camouflage as fake block.
Feline: Smaller, less HP, faster. Speed boosts in combat. Water slows you down. Focus: High leap.
Infernal: Water is harmful. Fire immune. More damage when on fire. Cooks food passively. Focus: Set self on fire.
Elytrian: Starts with unique elytra. Elytra flight gives more damage. Control descending speed. Double fall damage. Focus: Launch into air.
Honey Bee: Starts with unique elytra. Smaller with less HP but natural armor. Elytra unbreakable but slower. Store potion effects from flowers. Create honey bottles with stored effects. Requires Bug + Plant essence.
Rascal: Much smaller (~1.2 blocks), less HP. Less attack reach, more block reach. Stronger/faster in dark, weaker in light. Focus: Teleport down to a cave below.
Rotten: Can't drown but vulnerable to Smite. Weaker in sunlight and when unprovoked. Slower in water but has natural armor. Focus: Summon Zombified Piglins for protection.
Arachnid: Vulnerable to Bane of Arthropods, less HP. Jump higher, land safely from higher. Climb any surface including ceilings. Resistance in cobwebs. Focus: Create/remove cobwebs. Launch from walls.
Oozeling: Extremely bouncy, knocked around easier. Jump higher (even more when sneaking). Armor less effective. Focus: Amplify bounciness.

=== POWER TRIMS 2.9 ===
Wearing a full matching trimmed armor set grants special powers. Activate ability with Shift+F. Disrupt abilities trigger automatically at low HP (4 hearts).
Sentry: Passive — Resistance I. Active — defensive ability.
Dune: Passive — Haste + Fire Resistance. Active — Sandstorm: blinds/slows enemies, knockback, gives Strength+Speed for 10s. 60s CD.
Eye: Passive — Night Vision. Active — True Sight: reveal all entities within 80 blocks, remove invisibility, make entities glow and slow/weak. 120s CD.
Coast: Passive — Dolphin's Grace. Active — Water Burst: pull all within 30 blocks, inflict Weakness II+Slowness II for 4s. 60s CD.
Wild: Passive — Regen I. Active — Vine Grapple: launch vine up to 60 blocks, grapple blocks/enemies, poison for 10s. 20s CD. Disrupt — Root Trap at 4 hearts.
Tide: Passive — Dolphin's Grace III. Active — Water Wall: summons 6-block tall wave forward 20 blocks, pushes back/slows enemies. 120s CD.
Snout: Passive — Strength I. Active — Summon Wither Skeletons for 90s. 120s CD.
Rib: Passive — Resistance I. Active — Summon Bogged for 60s. 60s CD.
Spire: Passive — Speed II. Active — Dash: dash forward 8 blocks, enemies hit take 60% more damage. 30s CD.
Vex: Passive — Speed II. Active — Debuff nearby players (30 block radius, 8 damage). 120s CD. Disrupt — True Invisibility for 10s.
Ward: Passive — Resistance I. Active — Barrier: Absorption V + Resistance III + Fire Resistance for 10s. 120s CD.
Wayfinder: Passive — Move fast while sneaking. Active — Mark location for teleportation, infinite range. 120s CD.
Silence: Passive — Strength II. Active — Warden's Roar: disables ender pearls in 15 blocks, blinds/slows enemies for 20s. 90s CD. Disrupt — Warden's Echo at 4 hearts.
Raiser: Passive — Negate all fall damage. Active — Shockwave: jump and slam, pull enemies, slowness+weakness, disable pearls for 10s. 120s CD.
Host: Passive — Most mobs ignore you. Active — Steal 2 hearts + positive effects from enemies within 10 blocks. 120s CD.
Flow: Passive — Speed II. Active — Fly for 20s, costs 1 heart/sec. 60s CD.
Bolt: Passive — Speed III. Active — Lightning chain: strikes up to 3 targets within 10 blocks, 6 initial damage, 4 chain damage. 20s CD.
Shaper: No abilities currently.
Mythic Rituals: /upgrade to open the Ritual menu. Upgrade armor with specific items. Silence Ultimate transforms you into a Warden (requires LibsDisguises). Fill Rage Bar by fighting, then Shift+1 to transform. Sub-abilities: Shift+7,8,9.
Commands: /ptconfig (admin GUI), /upgrade (rituals), /trust <player>, /untrust <player>, /trustlist, /pt resetcooldown.
`;

let playerName = '';
let msgHistory = [];
let loading = false;
let controller = null;

const saved = sessionStorage.getItem('mtm_name');
if (saved) { document.getElementById('name-input').value = saved; join(); }

function join() {
  const name = document.getElementById('name-input').value.trim();
  const err = document.getElementById('join-error');
  if (!name || name.length > 16) { err.textContent = 'Enter a valid IGN (1-16 characters)'; return; }
  err.textContent = '';
  playerName = name;
  sessionStorage.setItem('mtm_name', name);
  document.getElementById('display-name').textContent = 'Chatting as ' + name;
  document.getElementById('join-screen').style.display = 'none';
  document.getElementById('chat-screen').classList.add('active');
  document.getElementById('msg-input').disabled = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').focus();
  // Welcome
  const area = document.getElementById('msg-area');
  area.innerHTML = '<div class="msg welcome">Ask me anything about Minecraft or the server, ' + name + '.</div>';
}

function addMsg(role, text, sender) {
  const area = document.getElementById('msg-area');
  const el = document.getElementById('typing-el');
  if (el) el.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  if (sender) { const s = document.createElement('div'); s.className = 'sender'; s.textContent = sender; d.appendChild(s); }
  const t = document.createElement('div'); t.className = 'text'; t.textContent = text; d.appendChild(t);
  const tm = document.createElement('div'); tm.className = 'time';
  const n = new Date();
  tm.textContent = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  d.appendChild(tm);
  area.appendChild(d);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('msg-area');
  const el = document.getElementById('typing-el');
  if (el) el.remove();
  const d = document.createElement('div'); d.id = 'typing-el';
  d.className = 'msg bot';
  d.innerHTML = '<div class="sender">MTM</div><div class="text">typing...</div>';
  area.appendChild(d);
  area.scrollTop = area.scrollHeight;
}

async function send() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || loading) return;
  input.value = '';
  addMsg('user', text, playerName);
  msgHistory.push({ role: 'user', content: text });
  loading = true; input.disabled = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('status').textContent = 'thinking...';
  showTyping();
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL,
        messages: [{ role: 'system', content: SYSTEM.replace('{name}', playerName) }, ...msgHistory],
        max_tokens: 2048,
        temperature: 0.7,
      })
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText || 'HTTP ' + res.status);
    }
    const data = await res.json();
    const reply = data.choices[0].message.content;
    addMsg('bot', reply, 'MTM');
    msgHistory.push({ role: 'assistant', content: reply });
  } catch (e) {
    addMsg('bot', '⚠ Error: ' + e.message, 'MTM');
  }
  loading = false; input.disabled = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('status').textContent = 'ready';
  input.focus();
}

document.getElementById('msg-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('name-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); join(); }
});
</script>
</body>
</html>
